    <main>
        <h1>Contato</h1>
       <section id="container-contato">

           <img src="https://via.placeholder.com/600x300" alt="Imagem de Contato">
           
           <form action="">
               <label for="name">Nome:</label>
               <input type="text" name="nome" id="nome" maxlength="200" required >
               
               <label for="email">Email:</label>
               <input type="email" name="email" id="email" maxlength="200" required>
               
               <label for="mensagem">Mensagem:</label>
               <textarea name="mensagem" id="mensagem" maxlength="500" required></textarea>
               
               <button type="submit">Enviar</button>
            </form>
        </section>
